name: Deploy planner to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # make browsers fetch the new app.js / style.css after every deploy (not a stale cached copy)
      - name: Stamp file versions
        env:
          V: ${{ github.sha }}
        run: |
          short="${V:0:8}"
          sed -i "s#href=\"style.css\"#href=\"style.css?v=$short\"#; s#src=\"app.js\"#src=\"app.js?v=$short\"#" public/index.html
          grep -q "app.js?v=$short" public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
